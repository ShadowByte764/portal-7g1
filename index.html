const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const attr=esc;const save=()=>localStorage.setItem('portal7g-data',JSON.stringify(data));const today=()=>{const d=new Date().getDay();return d===0?5:d-1};function dates(){const n=new Date(),d=n.getDay()||7,m=new Date(n);m.setDate(n.getDate()-d+1);return days.map((_,i)=>{const x=new Date(m);x.setDate(m.getDate()+i);return String(x.getDate()).padStart(2,'0')+'.'+String(x.getMonth()+1).padStart(2,'0')})}
let activeTab='schedule';function switchTab(name){activeTab=name;document.querySelectorAll('.nav-item').forEach(x=>x.classList.toggle('active',x.dataset.tab===name));render();renderFloatingSubnav();initScrollAnimations();window.scrollTo({top:0,behavior:'smooth'})}let screenObserver=null;function observeScreens(){if(screenObserver)screenObserver.disconnect();screenObserver=new IntersectionObserver(entries=>entries.forEach(entry=>{if(entry.isIntersecting)entry.target.classList.add('in-view');else entry.target.classList.remove('in-view')}),{threshold:.25});document.querySelectorAll('.snap-section').forEach(section=>screenObserver.observe(section))}function renderFloatingSubnav(){}function initScrollAnimations(){observeScreens()}
function screen(kind,content,water){return `<section class="snap-section screen-${kind}" data-kind="${kind}"><div class="watermark">${water}</div><div class="screen wrap"><div class="slide-content-box reveal">${content}</div></div></section>`}function cubeMarkup(id,label,faces){return `<div class="cube-stage scene-3d"><div class="glass-lens"></div><div id="${id}" class="cube-3d"></div></div><div class="cube-controls"><button data-cube="${id}" data-dir="-1">←</button><span id="${label}" class="cube-label">ПОНЕДЕЛЬНИК</span><button data-cube="${id}" data-dir="1">→</button></div>`}
function dayContent(i){if(i===5)return `<article class="saturday glass reveal"><div><strong>СУББОТА</strong><p>Не учебный день</p></div></article>`;return `<article class="day-card glass reveal"><div class="date">${dates()[i]} ${i===today()?'<span class="today">СЕГОДНЯ</span>':''}</div><h3>${days[i]}</h3><div class="lesson-lines">${data.schedule[i].map((s,j)=>`<div class="lesson-line stagger" style="--i:${j}"><time>${times[j][0]}–${times[j][1]}</time><b>${esc(s)}</b></div>`).join('')}</div></article>`}
function renderSchedule(){let html=screen('hero',`<div class="eyebrow">РАСПИСАНИЕ · 7Г</div>${cubeMarkup('schedule-cube','schedule-label')}<h1 class="chromatic">РАСПИСАНИЕ<br>7Г КЛАССА</h1><p>Дни недели и уроки класса в полноэкранном режиме.</p>`,'7Г · РАСПИСАНИЕ');for(let i=0;i<6;i++)html+=screen('schedule-day',dayContent(i),days[i].toUpperCase());return html}
function homeworkDay(i){if(i===5)return `<article class="homework-day glass reveal saturday"><div><strong>СУББОТА</strong><p>Не учебный день</p></div></article>`;return `<article class="homework-day glass reveal"><div class="eyebrow">${dates()[i]}</div><h2>${days[i]}</h2><div class="homework-list">${data.schedule[i].map((s,j)=>{const id=i+'-'+j,done=JSON.parse(localStorage.getItem('portal7g-done')||'[]').includes(id),task=data.homework.find(x=>x.id===id)?.text||'Повторить материал урока';return `<label class="hw-row stagger ${done?'done':''}" style="--i:${j}"><input type="checkbox" data-hw="${id}" ${done?'checked':''}><span><span class="hw-subject">${esc(s)}</span><span class="hw-time">${times[j][0]}–${times[j][1]}</span><span class="hw-text">${esc(task)}</span></span></label>`}).join('')}</div></article>`}function renderHomework(){const done=JSON.parse(localStorage.getItem('portal7g-done')||'[]'),pct=Math.min(100,Math.round(done.length/34*100));let tracker=`<div class="tracker glass reveal"><div class="progress-row"><strong>Выполнено: ${done.length}/34 (${pct}%)</strong><span class="eyebrow">ТРЕКЕР ДЗ</span></div><div class="progress"><i style="width:${pct}%"></i></div><div class="filters"><button class="btn">Все</button><button class="btn">Гр. 1</button><button class="btn">Гр. 2</button></div></div>`;return screen('homework',tracker+homeworkDay(0),'ДЗ · ПН')+[1,2,3,4,5].map(i=>screen('homework',homeworkDay(i),'ДЗ · '+days[i].slice(0,2).toUpperCase())).join('')}
function media(n){if(!n.media)return `<div class="news-media">${esc(n.icon)}</div>`;return `<div class="news-media">${n.mediaType==='video'?`<video src="${attr(n.media)}" controls playsinline></video>`:`<img src="${attr(n.media)}" alt="">`}</div>`}function poll(n,i){if(!n.poll?.active)return '';const total=n.poll.votes.reduce((a,b)=>a+b,0);return `<div class="poll"><b>${esc(n.poll.question||'Опрос')}</b>${n.poll.options.map((o,j)=>{if(!o)return '';if(n.poll.voted){const p=total?Math.round(n.poll.votes[j]/total*100):0;return `<label>${esc(o)}</label><div class="poll-result"><i style="width:${p}%"></i><span>${p}% · ${n.poll.votes[j]}</span></div>`}return `<button data-vote="${i}:${j}">${esc(o)}</button>`}).join('')}</div>`}function renderNews(){let html=screen('news',`<div class="eyebrow">НОВОСТИ · 7Г</div>${cubeMarkup('news-cube','news-label')}<p>Темы класса, медиа и опросы.</p>`,'НОВОСТИ');data.news.slice(0,6).forEach((n,i)=>{html+=screen('news',`<article class="news-card glass reveal">${media(n)}<div class="news-content"><div class="eyebrow">${esc(n.kicker)}</div><h2>${esc(n.title)}</h2><p>${esc(n.text)}</p>${poll(n,i)}<div class="support"><button class="like" data-like="${i}">🔥 Поддержать <b>${n.likes||0}</b></button></div></div></article>`,n.kicker)});return html}
function renderBells(){return screen('bells',`<div class="eyebrow">ЗВОНКИ · 7Г</div><div class="timer-board glass reveal"><div><div id="timer-state" class="eyebrow">СТАТУС</div><h2 id="timer-subject">Загрузка…</h2></div><div id="timer-big" class="timer-big">00:00</div></div><div class="bells-list reveal">${times.map((t,i)=>`<div class="bell glass" data-bell="${i}"><div><b>${i+1} урок</b><br><small>${t[0]} — ${t[1]}</small></div><span class="status" hidden>ИДЁТ СЕЙЧАС</span></div>`).join('')}</div>`,'ЗВОНКИ')}
function render(){const app=document.getElementById('app');app.innerHTML=activeTab==='schedule'?renderSchedule():activeTab==='homework'?renderHomework():activeTab==='news'?renderNews():renderBells();requestAnimationFrame(()=>{observeScreens();setupActiveCube();updateLive();updateDots()})}
let cubes={};function setupCube(id,label,faces,type){const el=document.getElementById(id),lab=document.getElementById(label);if(!el)return;let index=type==='schedule'?today():0,rx=0,ry=type==='schedule'?-index*60:0,drag=null,vx=0,vy=0,moved=false;const paint=()=>{el.innerHTML=faces.map((f,i)=>`<div class="cube-face" data-face="${i}">${f}</div>`).join('');el.style.transform=`rotateX(${rx}deg) rotateY(${ry}deg)`;lab.textContent=type==='schedule'?days[index].toUpperCase():'ТЕМА '+String(index+1).padStart(2,'0');el.querySelectorAll('.cube-face').forEach(f=>f.addEventListener('click',()=>{if(moved)return;const i=+f.dataset.face;index=i;if(type==='schedule')ry=-i*60;paint();document.querySelectorAll('.snap-section')[i+1]?.scrollIntoView({behavior:'smooth'})}))};const start=e=>{e.preventDefault();moved=false;const p=e.touches?e.touches[0]:e;drag={x:p.clientX,y:p.clientY};el.classList.add('dragging');if(e.pointerId!==undefined)el.setPointerCapture(e.pointerId)};const move=e=>{if(!drag)return;e.preventDefault();const p=e.touches?e.touches[0]:e,dx=p.clientX-drag.x,dy=p.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>4)moved=true;drag={x:p.clientX,y:p.clientY};ry+=dx*.65;rx=Math.max(-75,Math.min(75,rx-dy*.65));vx=-dy*.65;vy=dx*.65;el.style.transform=`rotateX(${rx}deg) rotateY(${ry}deg)`};const end=()=>{drag=null;el.classList.remove('dragging')};el.addEventListener('mousedown',start);el.addEventListener('touchstart',start,{passive:false});el.addEventListener('pointermove',move);el.addEventListener('touchmove',move,{passive:false});el.addEventListener('pointerup',end);el.addEventListener('touchend',end);el.addEventListener('pointercancel',end);const animate=()=>{if(!drag&&(Math.abs(vx)>.05||Math.abs(vy)>.05)){rx=Math.max(-75,Math.min(75,rx+vx));ry+=vy;vx*=.94;vy*=.94;el.style.transform=`rotateX(${rx}deg) rotateY(${ry}deg)`}requestAnimationFrame(animate)};paint();animate();cubes[id]={next:()=>{index=(index+1)%6;if(type==='schedule')ry=-index*60;paint()},prev:()=>{index=(index+5)%6;if(type==='schedule')ry=-index*60;paint()}}}
function setupActiveCube(){if(activeTab==='schedule')setupCube('schedule-cube','schedule-label',data.schedule.map((_,i)=>i===5?'<div class="eyebrow">СУББОТА</div><h3>СУББОТА</h3><p>Не учебный день</p>':`<div class="eyebrow">${days[i]}</div><h3>${days[i]}</h3><ol>${data.schedule[i].map(esc).map(x=>'<li>'+x+'</li>').join('')}</ol>`),'schedule');if(activeTab==='news')setupCube('news-cube','news-label',data.news.slice(0,6).map(n=>`<div class="eyebrow">${esc(n.kicker)}</div><h3>${esc(n.title)}</h3><p>${esc(n.text)}</p>${n.poll?.active?'<div class="mini">ОПРОС</div>':''}`),'news')}
function updateDots(){const sections=[...document.querySelectorAll('.snap-section')],dots=document.querySelector('.right-dots');dots.innerHTML=sections.map((_,i)=>`<button data-dot="${i}" aria-label="Экран ${i+1}"></button>`).join('');dots.querySelectorAll('button').forEach((b,i)=>b.onclick=()=>sections[i].scrollIntoView({behavior:'smooth'}));const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){dots.querySelectorAll('button').forEach((b,i)=>b.classList.toggle('active',sections[i]===e.target))}}),{threshold:.2});sections.forEach(s=>io.observe(s));if(dots.firstElementChild)dots.firstElementChild.classList.add('active')}
function seconds(s){const [h,m]=s.split(':').map(Number);return h*3600+m*60}function fmt(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}function updateLive(){const secNow=(()=>{const n=new Date();return n.getHours()*3600+n.getMinutes()*60+n.getSeconds()})();const d=today(),list=data.schedule[d]||[];let current=-1,next=-1;times.forEach((t,i)=>{if(secNow>=seconds(t[0])&&secNow<seconds(t[1]))current=i;if(secNow<seconds(t[0])&&next<0)next=i});document.querySelectorAll('[data-bell]').forEach((x,i)=>{x.classList.toggle('current',i===current);x.querySelector('.status').hidden=i!==current});const live=document.getElementById('live-status');if(!live)return;const dot=live.querySelector('.live-dot'),strong=live.querySelector('strong');if(d===5){strong.textContent='Выходной';dot.className='live-dot break'}else if(current>=0){strong.textContent=`${current+1} ур. · ${list[current]||'Урок'}`;dot.className='live-dot';live.querySelector('i').style.width=((seconds(times[current][1])-secNow)/(40*60)*100)+'%'}else if(next>=0){strong.textContent=`Перемена · Далее: ${list[next]||'Урок'}`;dot.className='live-dot break'}else{strong.textContent='Уроки окончены';dot.className='live-dot break'}const big=document.getElementById('timer-big'),subject=document.getElementById('timer-subject'),state=document.getElementById('timer-state');if(!big)return;if(d===5){state.textContent='СУББОТА';subject.textContent='Не учебный день';big.textContent='—'}else if(current>=0){state.textContent=`${current+1} УРОК`;subject.textContent=list[current]||'Урок';big.textContent=fmt(seconds(times[current][1])-secNow)}else if(next>=0){state.textContent='ПЕРЕМЕНА';subject.textContent='Далее: '+(list[next]||'Урок');big.textContent=fmt(seconds(times[next][0])-secNow)}else{state.textContent='УРОКИ ОКОНЧЕНЫ';subject.textContent='До следующего учебного дня';big.textContent='—'}}
document.addEventListener('click',e=>{const c=e.target.closest('[data-cube]');if(c&&cubes[c.dataset.cube])cubes[c.dataset.cube][c.dataset.dir==='1'?'next':'prev']();const like=e.target.closest('[data-like]');if(like){const n=data.news[+like.dataset.like];if(!n.liked){n.liked=true;n.likes=(n.likes||0)+1;save();render()}}const vote=e.target.closest('[data-vote]');if(vote){const [i,j]=vote.dataset.vote.split(':').map(Number),p=data.news[i].poll;if(!p.voted){p.votes[j]++;p.voted=true;save();render()}}});document.addEventListener('change',e=>{if(e.target.matches('[data-hw]')){let done=JSON.parse(localStorage.getItem('portal7g-done')||'[]');done=e.target.checked?[...new Set([...done,e.target.dataset.hw])]:done.filter(x=>x!==e.target.dataset.hw);localStorage.setItem('portal7g-done',JSON.stringify(done));render()}});
function openAdminModal(){const dialog=document.getElementById('admin-dialog');if(typeof dialog.showModal==='function')dialog.showModal();else dialog.setAttribute('open','');document.getElementById('admin-login-screen').style.display='block';document.getElementById('admin-studio-content').style.display='none';document.getElementById('admin-pin-input').value='';document.getElementById('admin-pin-input').focus()}function openAdmin(){openAdminModal()}function verifyAdminPin(){const pinInput=document.getElementById('admin-pin-input');if(!pinInput)return;const val=pinInput.value.trim();if(val==='1485'){document.getElementById('admin-login-screen').style.display='none';document.getElementById('admin-studio-content').style.display='block';switchAdminTab('sched');renderAdminScheduleEditor()}else{alert('Неверный PIN-код!');pinInput.value='';pinInput.focus()}}function switchAdminTab(tab){const panes={sched:'admin-schedule',news:'admin-news',cloud:'admin-cloud'},target=panes[tab]||panes.sched;document.querySelectorAll('.admin-pane').forEach(p=>p.classList.toggle('active',p.id===target));document.querySelectorAll('.admin-tab').forEach(b=>b.classList.toggle('active',b.dataset.pane===target))}function renderAdminScheduleEditor(){setupAdmin()}function unlockAdmin(){verifyAdminPin()}document.querySelectorAll('.admin-tab').forEach(b=>b.onclick=()=>switchAdminTab(b.dataset.pane==='admin-schedule'?'sched':b.dataset.pane==='admin-news'?'news':'cloud'));function setupAdmin(){const dayEl=document.getElementById('admin-day'),newsIndexEl=document.getElementById('admin-news-index'),urlEl=document.getElementById('firebase-url');if(!dayEl||!newsIndexEl)return;dayEl.innerHTML=days.map((x,i)=>`<option value="${i}">${x}</option>`).join('');newsIndexEl.innerHTML=data.news.slice(0,6).map((_,i)=>`<option value="${i}">Грань ${i+1}</option>`).join('');dayEl.onchange=loadDay;document.getElementById('admin-lesson').onchange=loadDay;newsIndexEl.onchange=loadNews;loadDay();loadNews();if(urlEl)urlEl.value=data.firebaseUrl||''}function loadDay(){const dayEl=document.getElementById('admin-day'),lessonEl=document.getElementById('admin-lesson');if(!dayEl||!lessonEl)return;const d=+dayEl.value||0;lessonEl.innerHTML=(data.schedule[d]||[]).map((_,i)=>`<option value="${i}">${i+1} урок</option>`).join('');const i=+lessonEl.value||0;document.getElementById('admin-subject').value=data.schedule[d]?.[i]||'';document.getElementById('admin-homework').value=data.homework.find(x=>x.id===d+'-'+i)?.text||''}function saveLesson(){const d=+document.getElementById('admin-day').value,i=+document.getElementById('admin-lesson').value;data.schedule[d][i]=document.getElementById('admin-subject').value;const homeworkText=document.getElementById('admin-homework').value,old=data.homework.find(x=>x.id===d+'-'+i);if(old)old.text=homeworkText;else data.homework.push({id:d+'-'+i,text:homeworkText});save();render();setupAdmin()}function loadNews(){const indexEl=document.getElementById('admin-news-index');if(!indexEl)return;const n=data.news[+indexEl.value||0];document.getElementById('admin-kicker').value=n.kicker;document.getElementById('admin-title').value=n.title;document.getElementById('admin-text').value=n.text;document.getElementById('admin-media').value=n.media||'';document.getElementById('admin-poll-active').checked=!!n.poll?.active;document.getElementById('admin-question').value=n.poll?.question||'';n.poll.options.forEach((x,i)=>document.getElementById('poll-'+i).value=x)}function saveNews(){const n=data.news[+document.getElementById('admin-news-index').value||0];n.kicker=document.getElementById('admin-kicker').value;n.title=document.getElementById('admin-title').value;n.text=document.getElementById('admin-text').value;n.media=document.getElementById('admin-media').value;n.poll.active=document.getElementById('admin-poll-active').checked;n.poll.question=document.getElementById('admin-question').value;n.poll.options=[0,1,2,3].map(i=>document.getElementById('poll-'+i).value);save();render()}function resetPoll(){const p=data.news[+document.getElementById('admin-news-index').value||0].poll;p.votes=[0,0,0,0];p.voted=false;save();render();setupAdmin()}
function handleMediaUpload(event,index){const file=event.target.files?.[0];if(!file)return;if(file.type.startsWith('image/')){const reader=new FileReader();reader.onload=e=>{const img=new Image();img.onload=()=>{const scale=Math.min(1,900/img.width),canvas=document.createElement('canvas');canvas.width=img.width*scale;canvas.height=img.height*scale;canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);data.news[index].media=canvas.toDataURL('image/jpeg',.82);data.news[index].mediaType='image';save();render();setupAdmin();mediaStatus.textContent='Фото сжато и сохранено'};img.src=e.target.result};reader.readAsDataURL(file)}else if(file.type.startsWith('video/')){const reader=new FileReader();reader.onload=e=>{data.news[index].media=e.target.result;data.news[index].mediaType='video';save();render();setupAdmin();mediaStatus.textContent='Видео сохранено'};reader.readAsDataURL(file)}}async function cloudPut(){const input=document.getElementById('firebase-url'),status=document.getElementById('cloud-status'),u=(input?.value||'').trim().replace(/\/$/,'');if(!u){if(status)status.textContent='Укажи URL базы';return}try{const r=await fetch(u+'/portal7g.json',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});if(!r.ok)throw Error();data.firebaseUrl=u;save();if(status)status.textContent='Синхронизировано'}catch(e){if(status)status.textContent='Ошибка подключения'}}async function cloudGet(){const input=document.getElementById('firebase-url'),status=document.getElementById('cloud-status'),u=(input?.value||'').trim().replace(/\/$/,'');try{const r=await fetch(u+'/portal7g.json');if(!r.ok)throw Error();const x=await r.json();if(x){data=x;save();render();if(status)status.textContent='Загружено'}}catch(e){if(status)status.textContent='Ошибка загрузки'}}function downloadPortal(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['<!DOCTYPE html>\n'+document.documentElement.outerHTML],{type:'text/html'}));a.download='index.html';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
render();setInterval(updateLive,1000);
